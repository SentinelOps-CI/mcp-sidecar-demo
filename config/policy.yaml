# MCP Sidecar Demo Policy Configuration
# Implements minimal PERM-UNIFY-R1 schema

# Epochs define time-based permission windows
epochs:
  epoch-1:
    active: true
    expires_at: "2025-12-31T23:59:59Z"
    permissions:
      - read
      - write
      - call
      - grant
    metadata:
      description: "Initial demo epoch"
      created_by: "mcp-sidecar-demo"
      version: "1.0"
  
  epoch-2:
    active: false  # Inactive by default
    expires_at: "2026-06-30T23:59:59Z"
    permissions:
      - read
      - write
      - call
      - grant
    metadata:
      description: "Future epoch for rotation demo"
      created_by: "mcp-sidecar-demo"
      version: "1.0"

# Roles define access patterns
roles:
  default:
    epochs:
      - epoch-1
    tools:
      - filesystem
      - git
      - http
    permissions:
      - read
      - write
      - call
  
  admin:
    epochs:
      - epoch-1
      - epoch-2
    tools:
      - filesystem
      - git
      - http
      - system
    permissions:
      - read
      - write
      - call
      - grant
      - admin
  
  readonly:
    epochs:
      - epoch-1
    tools:
      - filesystem
      - git
    permissions:
      - read

# Witness configurations for IFC (Information Flow Control)
witnesses:
  sidecar-v1:
    type: "sidecar"
    version: "1.0"
    capabilities:
      - policy_enforcement
      - request_logging
      - cert_generation
  
  morph-cloud:
    type: "infrastructure"
    version: "1.0"
    capabilities:
      - vm_management
      - network_isolation
      - api_authentication

# Tool-specific permissions
tools:
  filesystem:
    allowed_operations:
      - list
      - read
      - write
      - delete
    restricted_paths:
      - "/etc/"
      - "/var/"
      - "/root/"
    max_file_size: "100MB"
  
  git:
    allowed_operations:
      - clone
      - pull
      - push
      - status
    allowed_remotes:
      - "github.com"
      - "gitlab.com"
    max_repo_size: "1GB"
  
  http:
    allowed_operations:
      - get
      - post
      - put
      - delete
    allowed_domains:
      - "api.github.com"
      - "httpbin.org"
    max_request_size: "10MB"

# Audit and logging configuration
audit:
  enabled: true
  log_level: "info"
  retention_days: 30
  cert_format: "CERT-V1"
  
  # Request logging
  log_requests: true
  log_decisions: true
  log_witnesses: true
  
  # Output formats
  output_formats:
    - jsonl
    - structured_logs
    - cert_records
